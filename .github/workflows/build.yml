name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ── Quick compile check ────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Compile all modules
        run: ./gradlew clean compileJava compileTestJava --no-daemon

  # ── Static analysis per module (SpotBugs, parallel) ────────
  lint:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - core-api
          - core-plugin
          - module-platform
          - module-folia
          - module-economy
          - module-event
          - module-gui
          - module-items
          - module-general
      fail-fast: false

    name: Lint ${{ matrix.module }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # Fails the job when any finding is reported (ignoreFailures = false)
      - name: Run SpotBugs on ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:spotbugsMain --no-daemon

      - name: Summarize SpotBugs findings
        if: always()
        run: |
          REPORT="${{ matrix.module }}/build/reports/spotbugs/main.xml"
          {
            echo "## SpotBugs: ${{ matrix.module }}"
            echo ""
            if [ -f "$REPORT" ]; then
              echo "Findings: **$(grep -c '<BugInstance' "$REPORT" || true)**"
            else
              echo "No report produced - the analysis did not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/spotbugs/
          retention-days: 30

  # ── Run tests per module (parallel) ────────────────────────
  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - core-api
          - core-plugin
          - module-platform
          - module-folia
          - module-economy
          - module-event
          - module-gui
          - module-items
          - module-general
      fail-fast: false

    name: Test ${{ matrix.module }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run tests for ${{ matrix.module }}
        id: test
        run: ./gradlew :${{ matrix.module }}:test --no-daemon

      # Primary: Display in PR/workflow checks UI
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results – ${{ matrix.module }}
          path: ${{ matrix.module }}/build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

      # Secondary: Generate markdown summary in workflow run
      - name: Generate Test Report Summary
        if: always()
        run: |
          echo "## ${{ matrix.module }} Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

          REPORT_DIR="${{ matrix.module }}/build/reports/tests/test"
          if [ -d "$REPORT_DIR" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[View Detailed HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Artifact: \`test-report-${{ matrix.module }}\`" >> $GITHUB_STEP_SUMMARY
          fi

      # Upload detailed HTML report as artifact
      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/test/
          retention-days: 30

      # Fail the job if the test step itself failed
      - name: Check test results
        if: failure() && steps.test.outcome == 'failure'
        run: |
          echo "Tests failed for ${{ matrix.module }}! Check the Test Results tab above."
          exit 1

  # ── Build & upload final shaded jar ────────────────────────
  package:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build shaded jar
        run: ./gradlew clean build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: core-plugin/build/libs/*.jar
